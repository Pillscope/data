name: Fetch US DailyMed Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: fetch-us-dailymed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4 lxml
          fi

      - name: Fetch DailyMed Rx labels (time-boxed)
        run: |
          mkdir -p us/spls
          timeout 19800 python3 scripts/dailymed_fetch.py --category rx --output-dir us

      - name: Commit and push progress
        run: |
          git config user.name "Pillscope"
          git config user.email "saifozark2@gmail.com"
          git add us/spls
          git diff --staged --quiet || git commit -m "Add batch of US DailyMed labels [automated]"
          git pull --rebase origin main
          git push
